name: Godot CI 打包

# 推送/PR 到 main 或 master 时自动执行：
# 1) 无头导入检查（脚本/场景零错误）
# 2) 冒烟测试（tests/smoke.gd 全部断言）
# 3) 安卓 APK 导出（debug 签名，可直接安装验证）
# 4) 打 tag（v*.*.*）时自动发布 GitHub Release 附带 APK
#
# 原理：使用官方 barichello/godot-ci:4.3 镜像，内置 Godot 4.3 headless、
# Android SDK、JDK17 与导出模板，无需本地任何打包环境。
# 本地只维护源码，推送到 GitHub 后由 Actions 完成全部构建。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    name: 导入检查与冒烟测试
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 无头导入（检查脚本/场景错误）
        run: |
          cd "$GITHUB_WORKSPACE"
          godot --headless --import 2>&1 | tail -5

      - name: 运行冒烟测试
        run: |
          cd "$GITHUB_WORKSPACE"
          godot --headless --path . --script res://tests/smoke.gd 2>&1 | tail -8

  export-android:
    name: 导出安卓 APK
    needs: test
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -storepass android \
              -keystore ~/.android/debug.keystore \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi

      - name: 配置导出模板与编辑器设置
        run: |
          set -e
          echo "HOME=$HOME  XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-<未设置>}  ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          # 0) 先让 Godot 初始化一次 EditorSettings（生成官方格式默认文件，避免手写格式不被识别）
          mkdir -p "$HOME/.config/godot"
          godot --headless --editor --quit 2>&1 | tail -3 || true
          echo "--- Godot 生成的默认 settings 前 8 行 ---"
          head -8 "$HOME/.config/godot/editor_settings-4.3.tres" 2>/dev/null || echo "（未生成，路径可能不同）"
          find "$HOME" -name "editor_settings*" -path "*godot*" 2>/dev/null | head -5
          # 1) 镜像内置导出模板默认在 /root/.local，而容器 HOME=/github/home，
          #    需把 4.3.stable 模板链接/复制到 HOME 下，否则报 No export template found。
          TPL_SRC="$(find /root/.local /usr /opt -path '*export_templates/4.3.stable/android_debug.apk' 2>/dev/null | head -1 || true)"
          if [ -z "$TPL_SRC" ]; then
            TPL_SRC="$(find / -path '*export_templates/4.3.stable/android_debug.apk' 2>/dev/null | head -1 || true)"
          fi
          if [ -n "$TPL_SRC" ]; then
            TPL_DIR="$(dirname "$TPL_SRC")"
            echo "--- 镜像模板目录: $TPL_DIR ---"
            ls -la "$TPL_DIR" | head -40
            mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
            for f in "$TPL_DIR"/*; do
              [ -f "$f" ] && cp -f "$f" "$HOME/.local/share/godot/export_templates/4.3.stable/" || true
            done
            echo "导出模板已就位: $(ls "$HOME/.local/share/godot/export_templates/4.3.stable" | wc -l) 个文件"
            echo "--- HOME 模板目录 android 相关 ---"
            ls -la "$HOME/.local/share/godot/export_templates/4.3.stable" | grep -i android || echo "（无 android 模板！）"
          else
            echo "警告：未找到 android_debug.apk 模板"
          fi
          # 2) 探测 JDK 路径（Godot Android 导出必需）
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JDK 路径: $JAVA_DIR"
          # 3) 写入 Godot 编辑器设置（Godot 4.3 真实键名：export/android/*）：
          #    Java SDK + debug keystore 路径（校验仅回退读取 editor settings 的 keystore 路径）
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\n' "$JAVA_DIR" "$HOME/.android/debug.keystore" > "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "--- 覆盖后 settings 内容 ---"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: 导出 APK（debug 签名）
        run: |
          cd "$GITHUB_WORKSPACE"
          # Godot 4.3 通过环境变量兜底 keystore 的 user/password（preset 留空时）
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build/android
          godot --headless --export-debug "Android" "build/android/hot-blood-zombie.apk" 2>&1 | tail -60
          ls -la build/android/

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/hot-blood-zombie.apk
          if-no-files-found: error

  release:
    name: 发布 Release（push 自动发布）
    needs: export-android
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: build/android/

      - name: 生成版本号
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=auto-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 自动构建 ${{ steps.ver.outputs.tag }}
          files: build/android/hot-blood-zombie.apk
          generate_release_notes: true
